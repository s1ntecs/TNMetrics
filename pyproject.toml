[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "metrics-api-admin"
version = "0.1.0"
description = "Metrics API test task with FastAPI, PostgreSQL, Redis, Celery, SQLAdmin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.30.0",
  "alembic>=1.13.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt==4.0.1",
  "redis>=5.2.0",
  "celery>=5.4.0",
  "sqladmin>=0.20.0",
  "itsdangerous>=2.2.0",
  "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.0",
  "mypy>=1.11.0",
  "ruff>=0.6.0",
  "aiosqlite>=0.20.0",
  "pre-commit>=3.8.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true
plugins = []
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = [
  "celery.*",
  "sqladmin.*",
  "passlib.*",
  "jose.*"
]
ignore_missing_imports = true
